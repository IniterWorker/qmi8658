[package]
name = "qmi8658"
categories = ["embedded", "no-std"]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Walter Bonetti <walter.bonetti@epitech.eu>"]
license = "MIT OR Apache-2.0"
description = "QMI8658 6-axis IMU driver for embedded-hal (blocking and async, I2C and SPI)"
keywords = ["no-std", "qmi8658", "embedded", "embedded-hal-driver", "sensor"]
include = [
    "src/**/*.rs",
    "CHANGELOG.md",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]
repository = "https://github.com/IniterWorker/qmi8658"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
default-target = "thumbv7em-none-eabihf"
targets = ["thumbv7m-none-eabi", "thumbv7em-none-eabihf"]

[dependencies]
embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0", optional = true }
defmt = { version = "1", optional = true }
log = { version = "0.4", default-features = false, optional = true }

[features]
default = []
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt"]
log = ["dep:log"]

[dev-dependencies]
embedded-hal-mock = { version = "0.11", features = ["embedded-hal-async"] }
futures = "0.3"
embedded-hal-bus = { version = "0.3", features = ["async"] }

[dev-dependencies.cargo-husky]
version = "1"
features = ["user-hooks"]

[lib]
name = "qmi8658"
path = "src/lib.rs"
